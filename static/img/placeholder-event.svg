<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background Base -->
  <rect width="800" height="500" fill="#182A54"/>

  <!-- Spotlight & Geometric Rays -->
  <path d="M 250 0 L 550 0 L 800 500 L 0 500 Z" fill="#1E356A" opacity="0.6"/>
  <path d="M 0 0 L 800 500 L 800 0 Z" fill="#132143" opacity="0.4"/>

  <!-- Concentric Orbit Ring Patterns -->
  <g stroke="#7193D9" fill="none" opacity="0.25">
    <circle cx="400" cy="250" r="120" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="400" cy="250" r="160" stroke-width="1.5"/>
    <circle cx="400" cy="250" r="200" stroke-width="1.5" stroke-dasharray="10,6"/>
    <circle cx="400" cy="250" r="240" stroke-width="1.5"/>
  </g>

  <!-- Central Event Emblem (Shield, Calendar, Clock, Ribbon) -->
  <g transform="translate(400, 240)">
    <!-- Shield Crest Outline -->
    <path d="M -85 -95 C -30 -95 0 -115 0 -115 C 0 -115 30 -95 85 -95 C 85 -10 65 65 0 100 C -65 65 -85 -10 -85 -95 Z" fill="none" stroke="#FAF1D6" stroke-width="7"/>
    
    <!-- Banner Ribbon -->
    <path d="M -110 30 L -75 30 L -75 60 L -92 45 L -110 60 Z" fill="#FAF1D6"/>
    <path d="M 110 30 L 75 30 L 75 60 L 92 45 L 110 60 Z" fill="#FAF1D6"/>
    <path d="M -80 25 L 80 25 L 80 55 L -80 55 Z" fill="#182A54" stroke="#FAF1D6" stroke-width="5"/>
    <!-- Center Star -->
    <polygon points="0,32 4,40 12,41 6,47 8,55 0,50 -8,55 -6,47 -12,41 -4,40" fill="#FAF1D6"/>

    <!-- Calendar Badge -->
    <g transform="translate(-42, -80)">
      <rect x="0" y="0" width="60" height="52" rx="6" fill="none" stroke="#FAF1D6" stroke-width="5"/>
      <line x1="16" y1="-8" x2="16" y2="4" stroke="#FAF1D6" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="-8" x2="44" y2="4" stroke="#FAF1D6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="16" cy="20" r="3" fill="#FAF1D6"/>
      <circle cx="30" cy="20" r="3" fill="#FAF1D6"/>
      <circle cx="44" cy="20" r="3" fill="#FAF1D6"/>
      <circle cx="16" cy="34" r="3" fill="#FAF1D6"/>
      <circle cx="30" cy="34" r="3" fill="#FAF1D6"/>
      <circle cx="44" cy="34" r="3" fill="#FAF1D6"/>
    </g>

    <!-- Clock Badge Overlay -->
    <g transform="translate(18, -35)">
      <circle cx="0" cy="0" r="22" fill="#182A54" stroke="#FAF1D6" stroke-width="5"/>
      <polyline points="0,-12 0,0 8,5" fill="none" stroke="#FAF1D6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Plus Accent (Top Right) -->
  <path d="M 720 70 v 32 M 704 86 h 32" stroke="#FAF1D6" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Terracotta Dot Accent (Bottom Left) -->
  <circle cx="145" cy="385" r="16" fill="#D28357"/>
</svg>
