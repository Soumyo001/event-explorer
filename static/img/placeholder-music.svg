<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background Base -->
  <rect width="800" height="500" fill="#13423D"/>

  <!-- Organic Overlay Circles -->
  <circle cx="680" cy="140" r="260" fill="#205E51" opacity="0.55"/>
  <circle cx="150" cy="420" r="300" fill="#1B554A" opacity="0.5"/>
  <circle cx="400" cy="250" r="220" fill="#246959" opacity="0.35"/>

  <!-- Concentric Rings -->
  <g stroke="#DAE9A9" fill="none" opacity="0.2">
    <circle cx="400" cy="250" r="120" stroke-width="1.2"/>
    <circle cx="400" cy="250" r="160" stroke-width="1.2"/>
    <circle cx="400" cy="250" r="200" stroke-width="1.2"/>
    <circle cx="400" cy="250" r="240" stroke-width="1.2"/>
  </g>

  <!-- Waveform Equalizer Bars -->
  <g fill="#DAE9A9">
    <rect x="278" y="202" width="24" height="96" rx="12"/>
    <rect x="318" y="165" width="24" height="170" rx="12"/>
    <rect x="358" y="125" width="24" height="250" rx="12"/>
    <rect x="398" y="185" width="24" height="130" rx="12"/>
    <rect x="438" y="145" width="24" height="210" rx="12"/>
    <rect x="478" y="158" width="24" height="184" rx="12"/>
    <rect x="518" y="212" width="24" height="76" rx="12"/>
  </g>

  <!-- Plus Accent (Top Left) -->
  <path d="M 120 65 v 32 M 104 81 h 32" stroke="#DAE9A9" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Coral Orange Dot Accent (Bottom Right) -->
  <circle cx="668" cy="372" r="16" fill="#E07A5F"/>
</svg>
