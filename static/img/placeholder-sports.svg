<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background Split -->
  <rect width="800" height="500" fill="#D68558"/>
  <path d="M 0 420 L 800 50 L 800 500 L 0 500 Z" fill="#C46A42"/>

  <!-- Court Lines -->
  <g stroke="#FAF1D6" stroke-width="2.5" fill="none" opacity="0.45">
    <rect x="80" y="65" width="640" height="370" rx="10"/>
    <line x1="400" y1="65" x2="400" y2="435"/>
    <rect x="80" y="145" width="110" height="210"/>
    <rect x="610" y="145" width="110" height="210"/>
  </g>

  <!-- Basketball Center Graphic -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="105" fill="#FAF1D6"/>
    <circle cx="0" cy="0" r="92" stroke="#C77648" stroke-width="7" fill="none"/>
    <line x1="-92" y1="0" x2="92" y2="0" stroke="#C77648" stroke-width="7"/>
    <line x1="0" y1="-92" x2="0" y2="92" stroke="#C77648" stroke-width="7"/>
    <path d="M 0 -92 C -52 -50 -52 50 0 92" stroke="#C77648" stroke-width="7" fill="none"/>
    <path d="M 0 -92 C 52 -50 52 50 0 92" stroke="#C77648" stroke-width="7" fill="none"/>
  </g>

  <!-- Plus Accent (Bottom Left) -->
  <path d="M 148 375 v 30 M 133 390 h 30" stroke="#FAF1D6" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Dark Green Dot Accent (Top Right) -->
  <circle cx="655" cy="117" r="15" fill="#254B3A"/>
</svg>
